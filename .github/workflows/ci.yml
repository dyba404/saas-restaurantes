# CI del monorepo: typecheck + tests + build en cada push/PR.
# El build incluye la generación de los service workers de Serwist (apps pos/kds/menu).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (RLS multi-tenant, sync offline, printer)
        run: npm test

      - name: Build de las 4 apps
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
